# Publishes the pages the extension ships (public/: the AI assistant page, the Privacy Policy and the Terms of Use) at
# https://ronirachmani.github.io/health-records-export-for-maccabi/, so they can be read before installing. The files
# go up as they ship, plus what only the web copy needs: og.png, the link preview's picture, rendered here by
# `store-assets -- og` with Roboto installed; social.png, the marquee at 1280x640 for the repository's social preview,
# which GitHub takes only as an upload in its settings; and an index.html that sends the site's root to the AI
# assistant page.
name: Pages

on:
  push:
    branches: [main]
    paths: [public/**, store/src/**, scripts/stage.mjs, scripts/store-assets.mjs, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}ai-assistant.html
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Render the link preview
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends fonts-roboto
          fc-cache -f
          # Ubuntu's AppArmor keeps Chrome's sandbox from starting without this.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npm run store-assets -- og social
      - uses: actions/configure-pages@v6
      - name: Assemble the site
        run: |
          cp -R public _site
          cp store/assets/og-1200x630.png _site/og.png
          cp store/assets/social-1280x640.png _site/social.png
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8" />
          <title>Health Records Export for Maccabi</title>
          <meta http-equiv="refresh" content="0; url=ai-assistant.html" />
          <link rel="canonical" href="ai-assistant.html" />
          <a href="ai-assistant.html">Hand it to an AI assistant</a>
          EOF
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
