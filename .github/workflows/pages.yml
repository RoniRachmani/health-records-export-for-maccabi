# Publishes the extension's website at https://maccabi.ronirachmani.com/: the landing
# page (site/), and the pages the extension ships (public/: the Privacy Policy and the Terms of
# Use), so they can be read before installing. public/ goes up as it ships, and site/ on top of it, plus what is made
# here, with Roboto installed:
#   og-site.png the landing page's link preview, a photograph of its own hero, by `store-assets -- og-site`;
#   social.png  the marquee at 1280x640 for the repository's social preview, which GitHub takes only as an upload in
#               its settings;
#   clips/      the landing page's silent loop, cut from the promo film: the popup working through an export. It is a
#               slice of the film rendered at 4K and cropped to the popup, so it is sharp at twice the size the page
#               shows it. It is kept in a cache keyed on what the film is drawn from, since rendering it takes about
#               eight minutes. (The export's folder, opened, is drawn by the page itself: site/index.html's .fw-list.)
#   sitemap.xml gets each page's <lastmod>: the day its own files last changed on main.
name: Pages

on:
  push:
    branches: [main]
    paths: [public/**, site/**, store/src/**, store/design/**, src/extension/popup/**, scripts/stage.mjs, scripts/site-check.mjs, scripts/store-assets.mjs, scripts/store-listing.mjs, scripts/store-auxiliary.mjs, scripts/store-video.mjs, docs/images/chrome-web-store-badge.png, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Run by hand on another branch, this job alone runs: the site is built and kept as the run's artifact, to look at
  # before it goes anywhere. Only main deploys.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, for the sitemap's dates.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Roboto
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends fonts-roboto
          fc-cache -f
          # Ubuntu's AppArmor keeps Chrome's sandbox from starting without this.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Before anything is drawn or deployed: every animation on the landing page still ends where the still page is.
      - name: Check the landing page's motion
        run: npm run site-check
      - name: Render the link preview
        run: npm run store-assets -- og-site social
      - id: clips
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _clips
          # Only what the film is drawn from: its own code, the popup it photographs, the icons, and the version the
          # popup prints. The pages in public/ and site/ are not, so changing them deploys without a render. The number
          # after "clips-" stands for the ffmpeg lines below: raise it when their times, crop or encoding change.
          key: clips-7-${{ hashFiles('store/src/**', 'src/extension/**', 'public/icons/**', 'scripts/stage.mjs', 'scripts/store-video.mjs', 'vite.store.config.ts', 'package.json', 'package-lock.json') }}
      - name: Render the clips
        if: steps.clips.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg
          mkdir -p _clips
          # The run clip: the whole export, from 0% (the film's runFrom) to two seconds after "Saved", drawn with --clip,
          # the popup over a white page and no pointer. The crop, in the film's 3840x2160, is flush with the popup's
          # sides and top and runs below its tallest; the size is twice the page's. The loop starts halfway through the
          # export (5.3s in), so its first frame, which is also the poster and the picture under reduced motion, shows
          # the run under way; the hard cut from "Saved" back to 0% falls inside it.
          npm run store-video -- 19.25 32.25 --silent --clip
          ffmpeg -y -loglevel error -i store/assets/promo-video.mp4 -an \
            -filter_complex "[0:v]crop=1134:1890:2471:208,scale=756:1260:flags=lanczos,fps=30,split[a][b];[a]trim=start=5.3,setpts=PTS-STARTPTS[late];[b]trim=end=5.3,setpts=PTS-STARTPTS[early];[late][early]concat[v]" \
            -map "[v]" -c:v libx264 -preset slow -crf 23 -tune animation -pix_fmt yuv420p \
            -colorspace bt709 -color_primaries bt709 -color_trc bt709 -color_range tv \
            -movflags +faststart _clips/run.mp4
          # WebP: a PNG of an H.264 frame is nearly the clip's own size.
          ffmpeg -y -loglevel error -i _clips/run.mp4 -frames:v 1 -c:v libwebp -quality 90 _clips/run.webp
          ls -l _clips
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Assemble the site
        run: |
          cp -R public _site
          cp store/assets/og-site-1200x630.png _site/og-site.png
          cp store/assets/social-1280x640.png _site/social.png
          cp -R site/. _site/
          mkdir -p _site/images
          cp docs/images/chrome-web-store-badge.png _site/images/
          cp -R _clips _site/clips
          # stamp <address> <the files the page is made of>
          stamp() {
            local day=$(git log -1 --format=%cs -- "${@:2}")
            if [ -n "$day" ]; then sed -i "s|<loc>$1</loc>|<loc>$1</loc><lastmod>$day</lastmod>|" _site/sitemap.xml; fi
          }
          stamp https://maccabi.ronirachmani.com/ site/index.html site/site.css site/ai-assistant.css public/pages.css
          stamp https://maccabi.ronirachmani.com/privacy.html public/privacy.html
          stamp https://maccabi.ronirachmani.com/terms.html public/terms.html
          cat _site/sitemap.xml
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
