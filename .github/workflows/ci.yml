# The gate that lives in this repo: the types check, the tests pass against the fake Maccabi, the
# store build comes out, and every popup state fits in Chrome's 600px (in the runner's own Chrome). There is no linter or formatter in this repo on purpose. CodeQL scans on top
# of this, from GitHub's default setup, so it has no workflow file here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The popup asks for Roboto first, so its height is measured in Roboto.
      - name: Install Roboto
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends fonts-roboto
          fc-cache -f
          # Ubuntu's AppArmor keeps Chrome's sandbox from starting without this.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Check that every popup state fits in 600px
        run: npm run site-check -- popup

  # Dependabot's pull requests merge themselves once the gate above passes, squashed like any other.
  # Not fflate, the one dependency that ships in the extension, and not a major version of an action,
  # which the release, Pages and render workflows use without this gate running them: those wait for a
  # person. The merge isn't GitHub's auto-merge, which with no required checks would merge before this
  # job had run.
  dependabot:
    needs: check
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        # The one action not GitHub's own, in a job that can write and merge: pinned to a commit (v3.1.0),
        # which Dependabot moves along with the tag.
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: >-
          steps.meta.outputs.dependency-type != 'direct:production' &&
          !(steps.meta.outputs.package-ecosystem == 'github_actions' && steps.meta.outputs.update-type == 'version-update:semver-major')
        run: gh pr merge "$PR" --squash
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
