# The gate that lives in this repo: the types check, the tests pass against the fake Maccabi, and the
# store build comes out. There is no linter or formatter in this repo on purpose. CodeQL scans on top
# of this, from GitHub's default setup, so it has no workflow file here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Dependabot's pull requests merge themselves once the gate above passes, squashed like any other.
  # Not fflate, the one dependency that ships in the extension, and not a major version of an action,
  # which the release, Pages and render workflows use without this gate running them: those wait for a
  # person. The merge isn't GitHub's auto-merge, which with no required checks would merge before this
  # job had run.
  dependabot:
    needs: check
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      - if: >-
          steps.meta.outputs.dependency-type != 'direct:production' &&
          !(steps.meta.outputs.package-ecosystem == 'github_actions' && steps.meta.outputs.update-type == 'version-update:semver-major')
        run: gh pr merge "$PR" --squash
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
