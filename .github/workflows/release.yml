# Publishes a GitHub release of the version package.json names. Run it by hand from the Actions tab, with that
# version, once its bump is on main and its notes are in docs/releases/<version>.md: the first line, "# <title>",
# is the release's name, and the rest its notes. It runs the gate, builds the store package (npm run package,
# which refuses a development build), and tags main's head v<version> as it publishes the release with that ZIP.
# It refuses a version whose tag already exists, so a release is never replaced. The Chrome Web Store upload
# stays by hand: download the ZIP from the release.
# Two jobs: `package` installs the dependencies and runs their code, so it can only read; `publish`, the one that can
# write, runs none of it, and only tags the commit `package` built and attaches the ZIP it handed over.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, as package.json has it (e.g. 0.8.5)
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Check the version, its notes and its tag
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$VERSION' is not a version like 0.8.5"; exit 1; }
          have=$(node -p "require('./package.json').version")
          [ "$have" = "$VERSION" ] || { echo "::error::package.json on main is $have, not $VERSION"; exit 1; }
          notes="docs/releases/$VERSION.md"
          [ -f "$notes" ] || { echo "::error::$notes is missing"; exit 1; }
          head -n 1 "$notes" | grep -q '^# ' || { echo "::error::$notes must open with '# <title>'"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::v$VERSION is already tagged"; exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-zip
          path: release/health-records-export-for-maccabi-${{ inputs.version }}.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      SHA: ${{ needs.package.outputs.sha }}
    steps:
      # The notes, from the commit that was packaged: main may have moved on since.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.package.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-zip
          path: release
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$VERSION.md"
          title=$(head -n 1 "$notes" | sed 's/^# *//')
          tail -n +2 "$notes" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" "release/health-records-export-for-maccabi-$VERSION.zip" \
            --target "$SHA" --title "$title" --notes-file "$RUNNER_TEMP/notes.md" --draft
          gh release edit "v$VERSION" --draft=false --latest
