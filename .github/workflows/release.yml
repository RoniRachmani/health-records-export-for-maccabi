# Publishes a GitHub release of the version package.json names. Run it by hand from the Actions tab, with that
# version, once its bump is on main and its notes are in docs/releases/<version>.md: the first line, "# <title>",
# is the release's name, and the rest its notes. It runs the gate, builds the store package (npm run package,
# which refuses a development build), and tags main's head v<version> as it publishes the release with that ZIP.
# It refuses a version whose tag already exists, so a release is never replaced. The Chrome Web Store upload
# stays by hand: download the ZIP from the release.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, as package.json has it (e.g. 0.8.5)
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Check the version, its notes and its tag
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$VERSION' is not a version like 0.8.5"; exit 1; }
          have=$(node -p "require('./package.json').version")
          [ "$have" = "$VERSION" ] || { echo "::error::package.json on main is $have, not $VERSION"; exit 1; }
          notes="docs/releases/$VERSION.md"
          [ -f "$notes" ] || { echo "::error::$notes is missing"; exit 1; }
          head -n 1 "$notes" | grep -q '^# ' || { echo "::error::$notes must open with '# <title>'"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::v$VERSION is already tagged"; exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$VERSION.md"
          title=$(head -n 1 "$notes" | sed 's/^# *//')
          tail -n +2 "$notes" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" "release/health-records-export-for-maccabi-$VERSION.zip" \
            --target "$(git rev-parse HEAD)" --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
