# Renders the approved store images (npm run store-assets) on Linux and checks the upload bundle: a check that a
# render still works after a change, not a source of images. The runner draws in its own fonts (DejaVu Sans, as
# Roboto is not installed), while the committed images are rendered on a Mac in its system face (store/README.md),
# so nothing here is committed: the ZIP and its hash manifest are kept as the run's artifact, and the summary lists
# which images came out different from the committed ones. The default route is `npm run store-assets` on a Mac;
# run this by hand from the Actions tab only as a check; name shots to render only those (e.g. "start open"), or leave
# it empty for all. The video is not rendered here: it is rendered on the Mac too (npm run store-video), and the
# Store video workflow (store-video.yml) is its optional check.
name: Store images

on:
  workflow_dispatch:
    inputs:
      shots:
        description: 'Shots: ask whole advice start open promo marquee icon poster og-site social (empty for all)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: store-images
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Ubuntu's AppArmor keeps Chrome's sandbox from starting without this.
      - name: Let Chrome's sandbox start
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Render
        env:
          SHOTS: ${{ inputs.shots }}
        # $SHOTS is split into shot names on purpose.
        run: npm run store-assets -- $SHOTS
      - name: Verify the listing upload bundle
        run: node scripts/check-store-assets.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-artwork
          path: |
            store/assets/store-artwork.zip
            store/assets/store-artwork.json
      - name: List the images that differ from the committed ones
        run: |
          {
            echo '### Images that differ from main'
            echo 'Expected for every listing image: the runner draws in other fonts. Never commit these.'
            echo '```'
            git status --short store/assets
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
