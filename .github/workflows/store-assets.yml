# Renders the store images (npm run store-assets) on Linux with Roboto installed, which the renders need and a
# maintainer's machine may not have, and pushes changed images to a branch for a pull request. Run it by hand from the Actions tab
# after the popup's appearance changes; name shots to render only those (e.g. "start open"), or leave it empty for
# all. The link previews (og, social) are drawn too but are gitignored: the Pages workflow publishes those.
# The video is not rendered here: it takes 20 minutes and goes to YouTube, not the repo. The Store video workflow
# (store-video.yml) renders its picture.
name: Store images

on:
  workflow_dispatch:
    inputs:
      shots:
        description: Shots to render, space-separated (empty for all)
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: store-images
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Roboto
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends fonts-roboto
          fc-cache -f
          fc-list | grep -qi roboto
          # Ubuntu's AppArmor keeps Chrome's sandbox from starting without this.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Render
        env:
          SHOTS: ${{ inputs.shots }}
        # $SHOTS is split into shot names on purpose.
        run: npm run store-assets -- $SHOTS
      - name: Push changed images for a pull request
        run: |
          git add store/assets
          if git diff --cached --quiet; then
            echo "No image changed."
            exit 0
          fi
          branch="store-images/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git switch -c "$branch"
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898799+github-actions[bot]@users.noreply.github.com'
          git commit -q -m "Re-render the store images" -m "Rendered by the Store images workflow, with Roboto."
          git push origin "HEAD:refs/heads/$branch"
          printf 'Open a pull request and wait for CI: %s\n' "https://github.com/$GITHUB_REPOSITORY/compare/main...$branch?expand=1" >> "$GITHUB_STEP_SUMMARY"
