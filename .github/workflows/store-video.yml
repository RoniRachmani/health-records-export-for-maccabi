# Renders the promo video's picture (npm run store-video -- --silent) on Linux with Roboto installed, and keeps it as
# the run's artifact: the MP4 is gitignored, since it goes to YouTube, not the repo. This is not the default route: the
# video is rendered on a Mac, with its sound, by `npm run store-video`, beside the store images (CONTRIBUTING.md). Run
# this by hand from the Actions tab to check that a render still works, or when no Mac is at hand.
#
# It renders no sound. The narration lives in a maintainer's .cache/narration/ (gitignored), cut from a take, so the
# soundtrack is put on afterwards, in seconds, where that cache is:
#   gh run download <run id> -n promo-video -D store/assets
#   npm run store-video -- --remux
# then upload store/assets/promo-video.mp4 to YouTube and re-render its poster on a Mac
# (npm run store-assets -- poster; store/README.md).
name: Store video

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: store-video
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    # The whole film is about 20 minutes here; this leaves room for a slow runner.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Roboto and ffmpeg
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends fonts-roboto ffmpeg
          fc-cache -f
          fc-list | grep -qi roboto
          # Ubuntu's AppArmor keeps Chrome's sandbox from starting without this.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Render the picture
        run: npm run store-video -- --silent
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: promo-video
          path: store/assets/promo-video.mp4
          # Already H.264: zipping it again saves nothing.
          compression-level: 0
          retention-days: 14
