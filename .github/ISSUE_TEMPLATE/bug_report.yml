name: Bug report
description: An export failed, stopped, or saved something wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Issues here are public.** Never paste health information, your ID number, a member id, or files from
        an export. Screenshots of the popup are fine as long as no record titles are visible — the list of
        failed items names records, so redact it.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what the popup said, and what you expected instead.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Chrome Web Store
        - Unpacked, from a release ZIP
        - Built from source
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      description: The version in the popup's footer, next to Privacy and Terms.
      placeholder: v0.5.0
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version
      description: From `chrome://version` — the first line.
      placeholder: 141.0.7390.55
    validations:
      required: true
  - type: input
    id: step
    attributes:
      label: Which step was it on?
      description: The stage the popup showed when it went wrong, if you saw it.
      placeholder: Test results
  - type: checkboxes
    id: clean
    attributes:
      label: Before you post
      options:
        - label: This report has no health information, ID number or export files in it.
          required: true
