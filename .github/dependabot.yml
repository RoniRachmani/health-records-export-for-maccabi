# fflate is the only dependency that ships in the extension, so it gets its own pull request and a
# proper look. Everything else is build-time and arrives grouped, once a week. CI merges every pull
# request from here once its gate passes, except fflate's and a major version of an action (the
# `dependabot` job in workflows/ci.yml).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      build:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
